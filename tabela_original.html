<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho sobre Tabelas HTML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.4;
    }

    h1 {
      font-size: 1.3rem;
      margin-top: 40px;
      margin-bottom: 10px;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    td, th {
      border: 1px solid #000;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    /* Cores da tabela Vendas Trimestrais (Exercício 5) */
    .cabecalho-exercicio_um {
      background-color: #5B9BD5; /* Azul */
      font-weight: bold;
      text-align: center;
      font-size: 1.1rem;
    }

    .vendas-2010 {
      background-color: #FFFF00; /* Amarelo */
      font-weight: bold;
      text-align: center;
      vertical-align: middle;
      font-size: 1.1rem;
    }


  </style>
</head>
<body>

  <!-- EXERCÍCIO 1 -->
  <h1>Exercício 1 – Vendas março e fevereiro 2010</h1>
  <table>
    <tr>
        <td colspan="2" class="cabecalho-exercicio_um">Vendas Trimestrais</td>
    </tr>
    <tr>
      <td class="vendas-2010">Carro</td>
      <td class="vendas-2010">Unidades</td>
    </tr>
    <tr>
      <td>Gol</td>
      <td>250.000</td>
    </tr>
    <tr>
      <td>Uno</td>
      <td>123.000</td>
   </tr>
      <td colspan="2"  class="cabecalho-exercicio_um">Vendas fev. 2010</td>
    <tr>
      <td class="vendas-2010">Carro</td>
      <td class="vendas-2010">Unidades</td>
    </tr>
    <tr>
      <td>Gol</td>
      <td>250.000</td>
    </tr>
    <tr>
      <td>Uno</td>
      <td>123.000</td>
    </tr>
  </table>
</body>
</html>
